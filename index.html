const RESULTS={
tank:{name:"인간 방패 탱커형",image:"images/result-tank.png",one:"공테 예약 전에 저부터 섭외하세요.",example:"팀원들이 수상한 구멍을 둘러싸고 토론하는 동안 이미 손을 넣어 확인합니다. 위험한 구간에서는 자연스럽게 선두가 됩니다.",analysis:["당신은 팀이 멈추는 순간 몸부터 움직이는 행동 담당입니다. 무섭지 않아서라기보다, 누군가는 해야 한다면 내가 하는 편이 빠르다고 생각합니다.","독립구간이나 NPC 대면처럼 모두가 서로 눈치 보는 상황에서 특히 존재감이 커집니다. 당신이 한 걸음 먼저 움직이면 정체됐던 진행도 함께 풀립니다.","다만 모든 위험을 혼자 떠맡을 필요는 없습니다. 문제 풀이와 물건 관리는 팀원에게 넘기고, 정말 필요한 순간에만 앞으로 나가면 가장 든든한 탱커가 됩니다."],closing:"팀의 용기는 대체로 당신을 앞세우는 방식으로 작동합니다."},
genius:{name:"문제 분쇄 이과천재형",image:"images/result-genius.png",one:"문제풀이는 맡겨주세요. 계산 실수는 못 본 척해주세요.",example:"팀원들이 그림을 감상할 때 숫자 배열부터 발견합니다. 정답이 안 맞으면 계산식과 입력 순서를 바꿔가며 끝까지 검증합니다.",analysis:["당신은 복잡한 정보를 규칙으로 바꾸는 데 강한 문제 해결 담당입니다. 숫자, 기호, 순서가 등장하면 머릿속에서 자동으로 구조가 만들어집니다.","팀이 감으로 답을 넣을 때 왜 그 답이 나왔는지 확인하고, 조건이 빠졌다면 다시 조립합니다. 잘 맞는 문제를 만났을 때의 집중력은 팀 전체의 진행 속도를 크게 올립니다.","단, 혼자 계산에 깊이 들어가면 이미 다른 곳에서 나온 단서를 놓칠 수 있습니다. 중간중간 풀이 과정을 입 밖으로 공유하면 천재력이 더 안정적으로 발휘됩니다."],closing:"문제가 복잡할수록 오히려 표정이 편안해집니다."},
search:{name:"숨은 단서 탐지견형",image:"images/result-search.png",one:"다들 세 번 봤다는 곳에서 제가 찾아냅니다.",example:"모두가 없다고 단정한 순간 높은 곳과 낮은 곳을 다시 봅니다. 액자 뒤, 가구 틈, 움직인 소품 아래는 그냥 지나치지 않습니다.",analysis:["당신은 문제보다 공간이 먼저 보이는 수색 담당입니다. 시선이 닿기 어려운 위치와 어색하게 비어 있는 부분을 자연스럽게 의심합니다.","팀원들이 같은 장소를 이미 확인했다고 말해도 직접 한 번 더 보는 편입니다. 그리고 이상하게도 그렇게 다시 본 곳에서 필요한 단서가 나옵니다.","다만 모든 것을 만지다 보면 이미 확인한 곳을 반복할 수 있습니다. 발견한 위치와 확인한 구역을 짧게 공유하면 탐지견의 코가 훨씬 효율적으로 움직입니다."],closing:"‘거기 봤어’라는 말은 당신에게 수색 종료를 의미하지 않습니다."},
social:{name:"NPC 절친 인싸형",image:"images/result-social.png",one:"대화는 맡겨주세요. 설정이 생기면 더 잘합니다.",example:"NPC가 사연을 말하면 가장 먼저 안타까워하고, 임무를 부탁하면 누구보다 진지하게 약속합니다. 입장한 지 5분 만에 세계관 주민이 됩니다.",analysis:["당신은 말만 많이 하는 사람이 아니라, 설정을 받는 순간 눈이 반짝이는 몰입 담당입니다. NPC의 대사와 감정을 진심으로 받아들이고 자연스럽게 다음 장면을 이어갑니다.","어색해서 모두가 굳어 있는 상황에서도 세계관 안의 말로 먼저 반응합니다. 덕분에 NPC와의 티키타카가 살아나고 팀원들도 한결 편하게 이야기에 들어갑니다.","문제 풀이가 막혀 분위기가 처질 때도 당신의 리액션과 파이팅이 팀을 다시 움직입니다. NPC가 말을 걸면 주어진 설정 안에서 자연스럽게 받아치며 장면의 재미를 살립니다."],closing:"NPC가 한마디를 건네면 누구보다 즐겁게 받아치는 몰입형 플레이어입니다."},
inventory:{name:"인간 인벤토리형",image:"images/result-inventory.png",one:"그 열쇠 어디 갔냐고요? 당연히 제가 갖고 있습니다.",example:"카드키, 필름, 열쇠를 사용 전과 사용 완료로 나눕니다. 팀원이 물건을 찾는 순간 조용히 정확한 소품을 꺼냅니다.",analysis:["당신은 팀의 모든 획득물을 책임지는 물건 관리 담당입니다. 무엇을 어디서 주웠고 어디에 사용했는지를 비교적 정확하게 기억합니다.","방이 복잡해질수록 당신의 가치가 커집니다. 소품이 테이블 위에 뒤섞여도 필요한 순간에 바로 꺼내 진행이 끊기는 것을 막아줍니다.","다만 모든 물건이 당신에게만 모이면 다른 팀원은 무엇이 있는지 모를 수 있습니다. 새로 챙긴 물건을 한 번씩 공지하면 살아 있는 인벤토리가 완성됩니다."],closing:"우리 팀의 주머니는 여러 개지만 인벤토리는 하나입니다."},
pm:{name:"탈출 총괄 PM형",image:"images/result-pm.png",one:"시간, 힌트, 팀원까지 관리합니다. 문제만 풀어주세요.",example:"입장하자마자 수색 구역을 나누고, 막히면 진행 상황을 모읍니다. 남은 시간을 보며 힌트를 쓸 시점도 결정합니다.",analysis:["당신은 여러 사람이 동시에 움직이는 방탈출을 하나의 프로젝트처럼 정리하는 진행 담당입니다. 누가 무엇을 보고 있는지 파악하고 빈 역할을 빠르게 채웁니다.","문제를 직접 많이 풀지 않은 것처럼 보여도 팀 전체의 중복 행동과 대기 시간을 크게 줄입니다. 특히 인원이 많거나 해야 할 일이 흩어진 테마에서 강합니다.","다만 정리에 집중하다 보면 본인이 즐길 틈을 놓칠 수 있습니다. 모든 것을 통제하기보다 팀이 정말 막혔을 때 방향만 잡아주는 PM이 가장 오래 사랑받습니다."],closing:"제한시간 60분짜리 프로젝트도 결국 납기 안에 끝냅니다."},
veteran:{name:"기출 꿰뚫는 경력직형",image:"images/result-veteran.png",one:"처음 보는 문제인데 이상하게 풀어본 적이 있습니다.",example:"제목 첫 글자, 남겨둔 소품, 연출이 끝난 뒤 시작되는 문제를 자연스럽게 의심합니다. 처음 온 미술관인데 동선이 낯설지 않습니다.",analysis:["당신은 많은 방탈출에서 쌓인 패턴을 현재 상황에 연결하는 경험 담당입니다. 문제의 정답을 외운 것이 아니라 제작자가 단서를 배치하는 방식을 익힌 쪽에 가깝습니다.","쓸모없어 보이는 숫자나 아직 사용하지 않은 소품을 기억하고, 연출 중 기다려야 할 순간과 행동해야 할 순간을 구분합니다. 덕분에 팀이 엉뚱한 곳에서 시간을 쓰는 일을 줄입니다.","다만 익숙한 방식에 기대면 새로운 장치를 기존 문법으로만 볼 수 있습니다. 경험으로 후보를 줄인 뒤 이번 테마만의 규칙을 확인하면 가장 노련한 플레이가 됩니다."],closing:"처음 보는 문제도 당신 앞에서는 어딘가 낯이 익습니다."}

const TYPE_ORDER=["tank","genius","search","social","inventory","pm","veteran"];
const PROFILE_LABELS={solve:"문제 해결력",search:"단서 탐지력",immerse:"세계관 몰입력",manage:"팀 운영력",action:"행동력"};
let step=0,choices={},myType=null,lastProfile=null;
function trackEvent(name,params={}){if(typeof gtag==="function")gtag("event",name,{test_id:TEST_ID,...params})}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function showOnly(id){[start,quiz,result,typeDetail].forEach(el=>el.classList.toggle("hidden",el.id!==id))}
function localStateUrl(encoded=""){const p=new URLSearchParams();if(encoded)p.set("r",encoded);if(DEBUG_MODE)p.set("debug","1");const query=p.toString();return `${location.pathname}${query?`?${query}`:""}`}
function begin(){history.replaceState(null,"",localStateUrl());trackEvent("test_start");step=0;choices={};myType=null;lastProfile=null;showOnly("quiz");render();scrollTo(0,0)}
function render(){const q=QUESTIONS[step];qnum.innerHTML=`${String(step+1).padStart(2,"0")}<small> /10</small>`;bar.style.width=`${step*10}%`;qimage.src=q.image;qimage.alt=`질문 ${step+1} 상황 이미지`;questionTitle.textContent=q.title;question.textContent=q.text;answers.innerHTML="";shuffle(q.answers).forEach((a,i)=>{const b=document.createElement("button");b.type="button";b.className="answer";b.innerHTML=`<span class="answer-no">${String(i+1).padStart(2,"0")}</span><span class="answer-text"></span>`;b.querySelector(".answer-text").textContent=a.text;b.onclick=()=>choose(q.id,a.answerId);answers.appendChild(b)})}
function choose(qid,answerId){choices[qid]=answerId;step++;if(step<QUESTIONS.length)render();else finish()}
function tally(){const score=Object.fromEntries(TYPE_ORDER.map(t=>[t,0])),primary=Object.fromEntries(TYPE_ORDER.map(t=>[t,0])),signatureCount=Object.fromEntries(TYPE_ORDER.map(t=>[t,0]));QUESTIONS.forEach(q=>{const answerId=choices[q.id],a=q.answers[answerId];if(!a)return;Object.entries(RESULT_WEIGHTS[q.id][answerId]).forEach(([type,value])=>score[type]+=value);primary[a.main]++;const signatureType=RESULT_SIGNATURES[q.id][answerId];if(signatureType)signatureCount[signatureType]++});return{score,primary,signatureCount}}
function signature(){return QUESTIONS.map(q=>choices[q.id]??0).join("")}
function hash(text){let h=2166136261;for(const c of text){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function classify(){const{score,primary,signatureCount}=tally();let candidates=TYPE_ORDER.filter(t=>t!=="veteran"||primary.veteran>=3);const max=Math.max(...candidates.map(t=>score[t]));candidates=candidates.filter(t=>score[t]===max);if(candidates.length>1){const smax=Math.max(...candidates.map(t=>signatureCount[t]));candidates=candidates.filter(t=>signatureCount[t]===smax)}if(candidates.length>1){const pmax=Math.max(...candidates.map(t=>primary[t]));candidates=candidates.filter(t=>primary[t]===pmax)}return candidates[hash(signature())%candidates.length]}
function profileRaw(){const raw=Object.fromEntries(Object.keys(PROFILE_LABELS).map(k=>[k,0]));QUESTIONS.forEach(q=>{const a=q.answers[choices[q.id]];if(!a)return;Object.entries(a.profile).forEach(([k,v])=>raw[k]+=v)});return raw}
function profileScores(){const raw=profileRaw(),values=Object.values(raw),mean=values.reduce((a,b)=>a+b,0)/values.length,seed=hash(signature()),jitter=i=>((seed>>>(i*4))%5)-2;return Object.fromEntries(Object.entries(raw).map(([k,v],i)=>[k,Math.max(20,Math.min(94,Math.round(52+(v-mean)*6+v*1.5+jitter(i))))]))}
function fillAnalysis(target,r){target.innerHTML="";r.analysis.forEach(t=>{const p=document.createElement("p");p.textContent=t;target.appendChild(p)});const c=document.createElement("p");c.className="closing";c.textContent=r.closing;target.appendChild(c)}
function renderScores(profile,target=scoreList){target.innerHTML="";Object.entries(PROFILE_LABELS).forEach(([k,label])=>{const v=profile[k],row=document.createElement("div");row.className="score";row.innerHTML=`<div class="score-top"><span>${label}</span><strong>${v}</strong></div><div class="meter"><div class="fill" style="width:${v}%"></div></div>`;target.appendChild(row)})}
function renderDebug(){if(!DEBUG_MODE){debugBox.classList.add("hidden");return}const{score,primary,signatureCount}=tally(),raw=profileRaw();debugBox.classList.remove("hidden");debugBox.innerHTML=`<h3>로직 테스트 모드</h3><div class="debug-grid"><pre>${TYPE_ORDER.map(t=>`${TYPES[t]}\n  결과 ${score[t]}점 · 대표 ${primary[t]}회 · 시그니처 ${signatureCount[t]}회`).join("\n")}</pre><pre>${Object.entries(PROFILE_LABELS).map(([k,label])=>`${label}\n  원점수 ${raw[k]} → 표시 ${lastProfile[k]}`).join("\n")}\n\n경력직 자격: ${primary.veteran>=3?"충족":"미충족"}</pre></div>`}
function finish({fromLink=false}={}){showOnly("result");myType=classify();lastProfile=profileScores();const r=RESULTS[myType];if(!fromLink){trackEvent("test_complete",{result_type:myType,result_name:r.name});history.replaceState(null,"",localStateUrl(encodeChoices()))}resultImage.src=r.image;resultImage.alt=r.name;resultTitle.textContent=`${TYPE_EMOJIS[myType]} ${r.name}`;resultOne.textContent=r.one;example.textContent=r.example;renderScores(lastProfile);fillAnalysis(analysis,r);renderDebug();renderTypeGrid();scrollTo({top:0,behavior:fromLink?"auto":"smooth"})}
function renderTypeGrid(){typesGrid.innerHTML="";TYPE_ORDER.forEach(type=>{const b=document.createElement("button");b.type="button";b.className="type-card";b.innerHTML=`<span class="type-card-name">${TYPE_EMOJIS[type]} ${RESULTS[type].name}</span>`;b.onclick=()=>showType(type);typesGrid.appendChild(b)})}
function showType(type){trackEvent("view_other_type",{type_key:type,type_name:RESULTS[type].name});const r=RESULTS[type];showOnly("typeDetail");typeImage.src=r.image;typeImage.alt=r.name;typeTitle.textContent=`${TYPE_EMOJIS[type]} ${r.name}`;typeOne.textContent=r.one;typeExample.textContent=r.example;fillAnalysis(typeAnalysis,r);scrollTo({top:0,behavior:"smooth"})}
function backToMyResult(){showOnly("result");scrollTo({top:0,behavior:"smooth"})}
function encodeChoices(){return btoa(QUESTIONS.map(q=>choices[q.id]).join("")).replaceAll("=","")}
function decodeChoices(value){try{const s=atob(value);if(!/^\d{10}$/.test(s))return false;const nums=[...s].map(Number);if(nums.some(n=>n<0||n>3))return false;choices=Object.fromEntries(nums.map((n,i)=>[i,n]));return true}catch{return false}}
function cleanUrl(){return `${location.origin}${location.pathname}`}
async function sharePayload(title,text,url){if(navigator.share){try{await navigator.share({title,text,url});return true}catch(e){if(e&&e.name==="AbortError")return false}}try{await navigator.clipboard.writeText([text,url].filter(Boolean).join("\n"));alert("공유 링크를 복사했어요.");return true}catch{return false}}
async function shareTest(){trackEvent("test_share");await sharePayload("","",cleanUrl())}
function goToOtherTests(placement){trackEvent("other_tests_click",{placement});location.href="https://youtubuhi.github.io/escape-player-lab/"}
function drawWrapped(ctx,text,x,y,maxWidth,lineHeight,maxLines=3){const chars=[...text];let line="",lines=[];for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}else line=test}if(line)lines.push(line);lines.slice(0,maxLines).forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));return y+Math.min(lines.length,maxLines)*lineHeight}
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.crossOrigin="anonymous";im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
async function makeShareCanvas(){const r=RESULTS[myType],canvas=document.createElement("canvas");canvas.width=900;canvas.height=1500;const ctx=canvas.getContext("2d");ctx.fillStyle="#f5f1eb";ctx.fillRect(0,0,900,1500);const im=await loadImage(r.image),imgW=510,imgH=760,x=(900-imgW)/2,y=45,scale=Math.min(imgW/im.width,imgH/im.height),dw=im.width*scale,dh=im.height*scale;ctx.drawImage(im,x+(imgW-dw)/2,y+(imgH-dh)/2,dw,dh);let cy=850;ctx.fillStyle="#77716b";ctx.font="24px Arial";ctx.fillText("방탈출 인간연구소 · TEST 002",60,cy);cy+=58;ctx.fillStyle="#151515";ctx.font="800 45px Arial";ctx.fillText(r.name,60,cy);cy+=48;ctx.fillStyle="#555";ctx.font="26px Arial";cy=drawWrapped(ctx,r.one,60,cy,780,37,2)+22;ctx.font="700 23px Arial";Object.entries(PROFILE_LABELS).forEach(([k,label],i)=>{const v=lastProfile[k],yy=cy+i*82;ctx.fillStyle="#151515";ctx.fillText(label,60,yy);ctx.textAlign="right";ctx.fillText(String(v),840,yy);ctx.textAlign="left";ctx.fillStyle="#ddd5cc";ctx.fillRect(60,yy+17,780,9);ctx.fillStyle="#b7202c";ctx.fillRect(60,yy+17,780*v/100,9)});return canvas}
async function shareResultCard(){
  const r=RESULTS[myType],url=`${cleanUrl()}?r=${encodeChoices()}`;
  trackEvent("result_share",{result_type:myType,result_name:r.name});
  try{
    const canvas=await makeShareCanvas(),blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));
    if(!blob)throw new Error("share image creation failed");
    const file=new File([blob],"my-escape-team-role.png",{type:"image/png"});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],url});return}catch(e){if(e&&e.name==="AbortError")return}
    }
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="my-escape-team-role.png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    try{await navigator.clipboard.writeText(url);alert("결과 이미지를 저장했고 결과 링크를 복사했어요.")}catch{alert("결과 이미지를 저장했어요.")}
  }catch{
    await sharePayload(`${TYPE_EMOJIS[myType]} ${r.name}`,`${TYPE_EMOJIS[myType]} ${r.name}`,url);
  }
}
function resetTest(){history.replaceState(null,"",localStateUrl());choices={};myType=null;lastProfile=null;showOnly("start");scrollTo({top:0,behavior:"smooth"})}
window.addEventListener("load",()=>{gtag("event","page_view",{test_id:TEST_ID,page_location:location.href,page_title:document.title});if(startImage.complete&&startImage.naturalWidth)startImage.classList.remove("hidden");const encoded=new URLSearchParams(location.search).get("r");if(encoded&&decodeChoices(encoded))finish({fromLink:true});else showOnly("start")});
</script>
